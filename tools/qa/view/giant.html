<!doctype html><meta charset="utf-8"><title>giant_buried</title>
<style>html,body{margin:0;background:#9fb3c8;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module">
// Осмотр модели великана в земле (img2threejs: поворотный стол). ?az=0&el=35&d=18 — азимут/высота камеры в градусах, расстояние
const THREE = await import('../../../js/vendor/three.module.min.js');
const { makeKit } = await import('../../../js/render3d/kit.js');
const { PROPS } = await import('../../../js/render3d/registry.js');
const q = new URLSearchParams(location.search), az = +(q.get('az') || 0) * Math.PI / 180, el = +(q.get('el') || 35) * Math.PI / 180, d = +(q.get('d') || 18);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true }); r.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene(), kit = makeKit(scene);
scene.add(new THREE.HemisphereLight(0xfff4dd, 0x55603a, 1.6)); const sun = new THREE.DirectionalLight(0xfff0d0, 2.2); sun.position.set(-8, 14, 10); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshLambertMaterial({ color: 0xa8b060 })); ground.rotation.x = -Math.PI / 2; scene.add(ground);
const m = PROPS[q.get('id') || 'giant_buried'].build(kit, {}); scene.add(m.root);
let tris = 0; m.root.traverse(o => { if (o.isMesh) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200), c = new THREE.Vector3(+(q.get('cx') || 0), 1, +(q.get('cz') || 0.6));
cam.position.set(c.x + Math.sin(az) * Math.cos(el) * d, c.y + Math.sin(el) * d, c.z + Math.cos(az) * Math.cos(el) * d); cam.lookAt(c);
r.render(scene, cam); window.__tris = tris; window.__done = true;
</script>
