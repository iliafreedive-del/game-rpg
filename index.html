<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0b0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dark Ascent">
<meta name="description" content="DARK ASCENT — мрачная изометрическая ролевая игра в духе классики: катакомбы, нежить, добыча и прокачка героя прямо в браузере.">
<title>DARK ASCENT — Пробуждение под катакомбами</title>
<link rel="icon" href="assets/sprites/icon_app.png">
<link rel="apple-touch-icon" href="assets/art/gpt/store/icon_180.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- П42 (сборка 60): сторож загрузки. Файлы игры не приходят (сеть режет хостинг, файл 404, ошибка модуля) — вместо вечной
     загрузки показываем причину. Стоит до стилей: пока css/style.css не пришёл, браузер не рисует страницу вообще.
     Русские тексты — в data-атрибутах (их не трогает tools/i18n), английские — в самом скрипте. -->
<script data-title="Игра не загрузилась" data-file="Не загрузился файл: " data-err="Ошибка: " data-stall="Файлы игры перестали приходить с сервера (40 с без продвижения загрузки)."
  data-hint="Что попробовать: обновить страницу (Ctrl+F5); другую сеть (мобильный интернет) или VPN — некоторые сети и провайдеры блокируют хостинг игры; другой браузер; включить аппаратное ускорение в настройках браузера." data-reload="Обновить">
(function () {
  var D = document.currentScript.dataset, en = !/^(ru|be|kk|uk|uz)/i.test(navigator.language || 'ru');
  var T = en ? { title: 'The game could not load', file: 'File did not load: ', err: 'Error: ', stall: 'Game files stopped arriving from the server (40 s without progress).',
    hint: 'Try: reload the page (Ctrl+F5); another network (mobile internet) or a VPN, since some networks block the game hosting; another browser; turn on hardware acceleration in browser settings.', reload: 'Reload' } : D;
  var done = false, box = null, fatal = false, t0 = Date.now(), last = t0;
  window.__bootStep = function () { last = Date.now(); };
  window.__bootOk = function () { done = true; if (box && !fatal) { box.remove(); box = null; } };   // finally loaded after a stall: hide the message
  window.__bootFail = function (why, isFatal) {
    if (box) return; fatal = !!isFatal;
    var L = document.querySelectorAll('link[rel=stylesheet]'); for (var i = 0; i < L.length; i++) if (!L[i].sheet) L[i].remove();   // a pending stylesheet keeps the page blank
    var E = function (tag, css, text, parent) { var e = document.createElement(tag); e.style.cssText = css; if (text) e.textContent = text; if (parent) parent.appendChild(e); return e; };
    var show = function () {
      box = E('div', 'position:fixed;inset:0;z-index:99999;background:#0d0b0e;color:#e8dcc0;font:16px/1.5 Georgia,serif;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center', '', document.body);
      var w = E('div', 'max-width:560px', '', box);
      E('h2', 'color:#e9c46a;margin:0 0 12px', T.title, w); E('p', '', why, w); E('p', 'color:#a99', T.hint, w);
      E('button', 'font:600 16px Georgia,serif;padding:10px 22px;margin-top:8px;cursor:pointer;color:#1a1208;background:#e9c46a;border:0;border-radius:6px', T.reload, w).onclick = function () { location.reload(); };
    };
    if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
  };
  addEventListener('error', function (e) { var t = e.target; if (!done && t && (t.tagName === 'SCRIPT' ? t.type === 'module' : t.tagName === 'LINK' && t.rel === 'stylesheet')) window.__bootFail(T.file + (t.src || t.href), true); }, true);
  addEventListener('unhandledrejection', function (e) { var r = e.reason; if (!done && r && /module/i.test(String(r.message || r))) window.__bootFail(T.err + (r.message || r), true); });
  // 40 s without progress, or the stylesheet still not here (the page stays blank even if the scripts ran): the network hangs
  // (e.g. an ISP slowing Cloudflare: the first ~16 KB arrive, then silence)
  var tick = setInterval(function () {
    var css = document.querySelector('link[rel=stylesheet]'), cssWait = !!css && !css.sheet, now = Date.now();
    if (box || (done && !cssWait)) return clearInterval(tick);
    if ((cssWait && now - t0 > 40000) || (!done && now - last > 40000)) window.__bootFail(T.stall, cssWait);
  }, 1000);
})();
</script>
<link rel="stylesheet" href="css/style.css" onload="window.__bootStep()">
</head>
<body>
<canvas id="game"></canvas>

<div id="ui" class="hidden">
  <div id="hudL">
    <div id="portrait" title="Герой и меню"><div id="lvl">1</div><span class="pt-menu"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg></span><span class="dot hidden" id="dotMenu"></span></div>
    <div class="bars">
      <div class="bar" id="hpBar"><i></i><b></b></div>
      <div class="bar" id="mpBar"><i></i><b></b></div>
      <div class="bar" id="xpBar"><i></i></div>
      <div id="buffs"></div>
    </div>
  </div>
  <div id="hudR">
    <div id="menu">
      <div id="goldBox"><span id="gold">0</span><span id="shards" class="c-shard">0◆</span><span id="torchN" title="Энергия — нажмите, чтобы получить" onclick="window.__openEnergy&&window.__openEnergy()">⚡0</span></div>
      <button class="mbtn" id="btnAuto" title="Автобой: герой сражается сам">АВТО</button>
    </div>
    <div id="huntBox" class="hidden" title="Охота: тревога о чудовище раз в 15 минут"></div>
    <div id="bossBar" class="hidden"><div class="n"></div><div class="bar"><i></i><b></b></div></div>
    <div id="tracker"></div>
    <button id="btnLead" class="hidden" title="Герой сам побежит к цели задания">➤ Веди меня</button>
    <canvas id="minimap" width="240" height="240"></canvas>
  </div>
  <div id="edgeArrow" class="hidden"><div class="ea-g"></div><div class="ea-a">➤</div><div class="ea-d"></div></div>
  <div id="toasts"></div>
  <div id="levelUp">Новый уровень!</div>

  <div id="joyZone"><div id="joyBase"><div id="joyKnob"></div></div></div>
  <button id="btnAct" class="hidden"></button>
  <div id="pad">
    <button id="btnAtk" class="cbtn" title="Атака (Пробел)"><canvas width="96" height="96"></canvas></button>
    <button id="sk0" class="cbtn sk" data-slot="0"></button>
    <button id="sk1" class="cbtn sk" data-slot="1"></button>
    <button id="sk2" class="cbtn sk" data-slot="2"></button>
    <button id="sk3" class="cbtn sk" data-slot="3"></button>
    <button id="btnScroll" class="cbtn" title="Свиток возврата (T)"><svg viewBox="0 0 24 24"><path d="M7 4h10v16H7z"/><path d="M5 4h4M15 20h4M10 9h4M10 13h4"/></svg><span class="pcount" id="scrollCount">0</span></button>
    <button id="btnDodge" class="cbtn" title="Уклонение (Shift)"><svg viewBox="0 0 24 24"><path d="M4 16c4 0 6-8 16-8"/><path d="M16 4l4 4-4 4"/></svg></button>
    <button id="potHP" class="cbtn" title="Зелье здоровья (Q)"><canvas width="96" height="96"></canvas><span class="pcount" id="hpCount">0</span></button>
    <button id="potMP" class="cbtn" title="Зелье маны (E)"><canvas width="96" height="96"></canvas><span class="pcount" id="mpCount">0</span></button>
  </div>
</div>

<div id="title">
  <div class="hero" id="titleHero"></div>
  <h1>DARK ASCENT</h1>
  <div class="sub">Глава I. Пробуждение под катакомбами</div>
  <div id="loadbar"><i></i></div>
  <div id="loadtxt" class="muted">Загрузка…</div>
  <div id="titleBtns" class="row hidden" style="flex-direction:column"></div>
</div>
<div id="death" class="hidden"></div>
<noscript>Для игры нужен JavaScript.</noscript>
<script type="module" src="boot.js"></script>
</body>
</html>
