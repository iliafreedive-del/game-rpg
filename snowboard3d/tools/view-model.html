<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Просмотр модели</title>
<style>html,body{margin:0;background:#cfd8e3;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js" } }</script></head>
<body><script type="module">
// Просмотр GLB из Blender: ?m=../models/rider.glb&yaw=0&dist=3&y=1&views=4
import * as THREE from 'three';
import { GLTFLoader } from '../vendor/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const views = +(q.get('views') || 4), W = innerWidth, H = innerHeight;
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(W, H); r.setScissorTest(true);
r.shadowMap.enabled = true; r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#cfd8e3');
scene.add(new THREE.HemisphereLight('#eef4ff', '#9aa3b5', 1.6));
const sun = new THREE.DirectionalLight('#fff3e0', 2.4); sun.position.set(3, 5, 4); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -2, right: 2, top: 3, bottom: -1 }); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: '#f4f6fb' }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const gl = await new GLTFLoader().loadAsync(q.get("m"));
if (q.get("only")) { const keep = gl.scene.getObjectByName(q.get("only")); gl.scene.children.slice().forEach((c) => { if (c !== keep) gl.scene.remove(c); }); keep.position.set(0, 0, 0); }
gl.scene.traverse((o) => { if (o.isMesh && o.geometry.attributes.color) { o.material.vertexColors = true; o.material.flatShading = true; o.material.needsUpdate = true; } });
gl.scene.traverse((o) => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } });
scene.add(gl.scene);
const box = new THREE.Box3().setFromObject(gl.scene), c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
const dist = +(q.get('dist') || Math.max(s.x, s.y, s.z) * 1.6), yaw0 = +(q.get('yaw') || 0);
const ty = q.get('y') != null ? +q.get('y') : c.y;
const cam = new THREE.PerspectiveCamera(30, (W / views) / H, 0.01, 200);
for (let i = 0; i < views; i++) {
  const a = yaw0 + i * Math.PI * 2 / views;
  cam.position.set(c.x + Math.sin(a) * dist, ty + dist * 0.18, c.z + Math.cos(a) * dist); cam.lookAt(c.x, ty, c.z);
  r.setViewport(i * W / views, 0, W / views, H); r.setScissor(i * W / views, 0, W / views, H); r.render(scene, cam);
}
document.title = 'ready ' + JSON.stringify({ size: s.toArray().map((v) => +v.toFixed(3)), tris: (() => { let n = 0; gl.scene.traverse((o) => { if (o.isMesh) n += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; }); return n; })() });
</script></body></html>
