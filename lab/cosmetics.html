<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Облики</title>
<style>
  html, body { margin: 0; height: 100%; background: #141218; color: #ece4d4; font: 14px/1.3 -apple-system, system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .tag { position: fixed; transform: translate(-50%, 0); text-align: center; font-weight: 700; font-size: 15px; text-shadow: 0 1px 3px #000, 0 0 2px #000; pointer-events: none; white-space: nowrap; }
  .tag small { display: block; font-weight: 500; font-size: 12px; color: #d6c8a8; }
  .tag .p { display: inline-block; margin-top: 3px; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: rgba(0,0,0,0.55); border: 1px solid rgba(214,165,72,0.5); color: #ffd480; }
  #title { position: fixed; left: 0; right: 0; top: 10px; text-align: center; font-size: 20px; font-weight: 800; letter-spacing: 0.03em; text-shadow: 0 2px 4px #000; color: #f0d8a0; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; color: #a49a88; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title"></div>
<div id="load">Загрузка…</div>
<script type="module" src="./cosmetics.js"></script>
</body>
</html>
