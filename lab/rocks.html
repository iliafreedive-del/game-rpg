<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Камни леса и Фьордов</title>
<style>html,body{margin:0;height:100%;background:#222;overflow:hidden}#c{width:100%;height:100%;display:block}#i{position:fixed;left:8px;top:6px;color:#eee;font:13px system-ui}</style></head>
<body><canvas id="c"></canvas><div id="i"></div>
<script type="module">
// Просмотр камней (13 октября): lab/rocks.html?set=forest|fjord|crag  — все виды в ряд, свет похода
import * as THREE from '../js/vendor/three.module.min.js';
import { makeKit } from '../js/render3d/kit.js';
import { LIGHT, CAMERA } from '../js/render3d/style.js';
import { ROCKS2_PROPS } from '../js/render3d/models/prop/_rocks2.js';
import { FJORD_PROPS } from '../js/render3d/models/prop/_fjord.js';
const Q = new URLSearchParams(location.search), set = Q.get('set') || 'forest', old = Q.get('old') === '1';
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true }); renderer.setPixelRatio(devicePixelRatio || 1);
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene(), kit = makeKit(scene), L = LIGHT[set === 'forest' ? 'wildForest' : 'wildFjord'];
const hemi = new THREE.HemisphereLight(L.hemi.sky, L.hemi.ground, L.hemi.i), sun = new THREE.DirectionalLight(L.key.color, L.key.i);
sun.position.set(...L.key.offset); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 80 }); sun.shadow.bias = -0.0006;
scene.add(hemi, sun); renderer.setClearColor(L.clear);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshLambertMaterial({ color: set === 'forest' ? 0x7a9a48 : 0xe6eef6 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const pre = old ? (set === 'forest' ? /^fo_rock_/ : set === 'crag' ? /^fj_crag(_[abc])?$/ : /^fj_(rock_|stone_)/) : new RegExp('^' + (set === 'forest' ? 'fo_rock2_' : set === 'crag' ? 'fj_crag2_' : 'fj_rock2_'));
const defs = [...new Map([...ROCKS2_PROPS, ...FJORD_PROPS].map(d => [d.id, d])).values()].filter(d => pre.test(d.id));
const sp = set === 'crag' ? 4.2 : 2.3, cols = set === 'crag' ? 3 : 4; let tris = 0;
defs.forEach((d, i) => { const { root } = d.build(kit); root.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; tris += o.geometry.attributes.position.count / 3; } });
  root.position.set((i % cols - (cols - 1) / 2) * sp, 0, Math.floor(i / cols) * sp * 0.9 - sp * 0.4); root.rotation.y = 0.5; scene.add(root); });
document.getElementById('i').textContent = defs.length + ' видов, треугольников на все: ' + Math.round(tris);
const cam = new THREE.PerspectiveCamera(CAMERA.fov, innerWidth / innerHeight, 0.5, 200), D = set === 'crag' ? 22 : 13;
cam.position.set(Math.sin(CAMERA.yaw) * D * Math.cos(0.6), D * Math.sin(0.6), Math.cos(CAMERA.yaw) * D * Math.cos(0.6)); cam.lookAt(0, set === 'crag' ? 1.2 : 0.4, 0.6);
import('../js/render3d/toon.js').then(({ U }) => { U.uCam.value.set(0, -100, 0); U.uFocus.value.set(0, -101, 0); renderer.setSize(innerWidth, innerHeight); renderer.render(scene, cam); window.__done = true; });
</script></body></html>
