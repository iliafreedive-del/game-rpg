<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проба сосны</title>
<style>html,body{margin:0;height:100%;background:#fff;overflow:hidden}#c{width:100%;height:100%;display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// lab/pine.html?k=pine,fir,broad&d=22 — игровые деревья (облегчённые, как в деревне) под камерой игры на траве
import * as THREE from '../js/vendor/three.module.min.js';
import { U } from '../js/render3d/toon.js';
import { LIGHT, CAMERA } from '../js/render3d/style.js';
import { buildGeo, matLive } from '../js/render3d/trees2.js';
const Q = new URLSearchParams(location.search), D = +(Q.get('d') || 22), kinds = (Q.get('k') || 'pine,fir,broad').split(',');
const R = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true }); R.setPixelRatio(1); R.setSize(innerWidth, innerHeight);
R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
const sc = new THREE.Scene(), L = LIGHT.village3;
const hemi = new THREE.HemisphereLight(L.hemi.sky, L.hemi.ground, L.hemi.i), sun = new THREE.DirectionalLight(L.key.color, L.key.i);
sun.position.set(...L.key.offset); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 90 }); sun.shadow.bias = -0.0006;
sc.add(hemi, sun, sun.target); R.setClearColor(L.clear);
const gr = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshLambertMaterial({ color: 0x5f8a3a })); gr.rotation.x = -Math.PI / 2; gr.receiveShadow = true; sc.add(gr);
const right = new THREE.Vector3(1, 0, -1).normalize(), stats = {};
kinds.forEach((k, i) => {
  const g = buildGeo(k, true), m = new THREE.Mesh(g, Q.get('basic') ? new THREE.MeshBasicMaterial({ vertexColors: true, map: matLive(k).map, alphaTest: 0.5, side: THREE.DoubleSide }) : matLive(k)); m.castShadow = true;
  m.position.copy(right.clone().multiplyScalar((i - (kinds.length - 1) / 2) * 4.6)); sc.add(m); stats[k] = g.attributes.position.count / 3;
});
const cam = new THREE.PerspectiveCamera(CAMERA.fov, innerWidth / innerHeight, 0.5, 300), P = 0.64;
cam.position.set(Math.sin(CAMERA.yaw) * D * Math.cos(P), D * Math.sin(P) + 2, Math.cos(CAMERA.yaw) * D * Math.cos(P)); cam.lookAt(0, +(Q.get('ly') || 2.2), 0);
U.uCam.value.set(0, -100, 0); U.uFocus.value.set(0, -101, 0); U.uWindStr.value = 0;
R.render(sc, cam); window.__stats = stats; window.__done = true;
</script></body></html>
