<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шерсть зверей</title>
<style>
  :root { color-scheme: dark; --bg: #141218; --panel: rgba(20, 18, 26, 0.86); --ink: #ece4d4; --muted: #a49a88; --gold: #d6a548; --line: rgba(214, 165, 72, 0.28); --chip: rgba(255, 255, 255, 0.06); }
  :root[data-theme="light"] { color-scheme: light; --bg: #f2ede4; --panel: rgba(250, 246, 238, 0.9); --ink: #2a2218; --muted: #6e6250; --gold: #9a6a1c; --line: rgba(154, 106, 28, 0.3); --chip: rgba(0, 0, 0, 0.05); }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { color-scheme: light; --bg: #f2ede4; --panel: rgba(250, 246, 238, 0.9); --ink: #2a2218; --muted: #6e6250; --gold: #9a6a1c; --line: rgba(154, 106, 28, 0.3); --chip: rgba(0, 0, 0, 0.05); } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.3 -apple-system, system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  .bar { position: fixed; left: 0; right: 0; padding: 8px max(12px, env(safe-area-inset-left)) 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  #top { top: 0; padding-top: max(8px, env(safe-area-inset-top)); background: linear-gradient(var(--panel), transparent); }
  #bottom { bottom: 0; padding-bottom: max(10px, env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--panel)); }
  .grp { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  .lbl { color: var(--muted); font-size: 12px; margin-right: 2px; }
  button { font: inherit; font-size: 13px; color: var(--ink); background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; min-height: 34px; cursor: pointer; }
  button.on { background: var(--gold); color: #1a1208; border-color: var(--gold); font-weight: 600; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; }
  #tags { position: fixed; top: 22%; left: 0; right: 0; display: flex; justify-content: space-around; pointer-events: none; font-weight: 700; letter-spacing: 0.04em; text-shadow: 0 1px 3px #000; color: #fff; opacity: 0; transition: opacity 0.2s; }
  #tags.show { opacity: 0.9; }
  #info { position: fixed; right: 12px; top: calc(max(8px, env(safe-area-inset-top)) + 90px); font-size: 11px; color: var(--muted); text-align: right; pointer-events: none; white-space: pre; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); }
  @media (max-width: 520px) { button { padding: 6px 10px; font-size: 12px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="load">Загрузка моделей…</div>
<div id="top" class="bar">
  <div class="grp" id="mobs"></div>
</div>
<div id="tags"><span>БЫЛО</span><span>СТАЛО</span></div>
<div id="info"></div>
<div id="bottom" class="bar">
  <div class="seg" id="mode"></div>
  <div class="grp" id="clips"></div>
  <div class="grp"><span class="lbl">Камера</span><div class="seg" id="cam"></div><button id="spin">Вращать</button></div>
  <div class="grp"><span class="lbl">Свет</span><div class="seg" id="light"></div></div>
</div>
<script type="module">
const BASE = location.pathname.includes('/lab/') ? '../' : './';
const THREE = await import(BASE + 'js/vendor/three.module.min.js');
const { makeKit } = await import(BASE + 'js/render3d/kit.js');
const { Actor } = await import(BASE + 'js/render3d/actor.js');
const { U } = await import(BASE + 'js/render3d/toon.js');
const { grassTex } = await import(BASE + 'js/render3d/textures.js');
const { LIGHT, CAMERA, HERO } = await import(BASE + 'js/render3d/style.js');
const MOBS = {};
MOBS.archer = (await import(BASE + 'js/render3d/models/hero/archer.js')).default;
MOBS.warrior = (await import(BASE + 'js/render3d/models/hero/warrior.js')).default;
MOBS.mage = (await import(BASE + 'js/render3d/models/hero/mage.js')).default;
const STAFF = (await import(BASE + 'js/render3d/models/weapon/staff_mage.js')).default;
const SWORD = (await import(BASE + 'js/render3d/models/weapon/sword_iron.js')).default, SHIELD = (await import(BASE + 'js/render3d/models/weapon/shield_round.js')).default;
const BOW = (await import(BASE + 'js/render3d/models/weapon/bow_hunter.js')).default;
for (const id of ['w_wolf', 'f_wolf', 'w_bear', 'w_boar', 'b_boar', 'b_hyena', 'b_scorpid', 'beast']) MOBS[id] = (await import(BASE + `js/render3d/models/mob/${id}.js`)).default;
// собака деревни: «Стало» — GLB из Meshy с ригом серого волка (assets/models/dog_town.glb), «Было» — прежняя процедурная собака деревни
const NPC_TRAINER = (await import(BASE + 'js/render3d/models/npc/npc_trainer.js')).default;
const { dogModel, chickenModel } = await import(BASE + 'js/render3d/critters.js');
MOBS.dog_brown = { id: 'dog_brown', kind: 'mob', outline: 'mob', build: kit => (kit.skin.SKINS.on && kit.mob.buildMob(kit, 'dog_brown', { height: 0.95, radius: 0.3, speed0: 1.1 })) || dogModel(kit, 1) };
// куры деревни: «Было» — процедурные, «Стало» — Meshy на прежнем риге куры (тело, голова, ноги те же группы)
MOBS.chicken_white = { id: 'chicken_white', kind: 'mob', outline: 'mob', build: kit => chickenModel(kit, 0, !kit.skin.SKINS.on) };
MOBS.chicken_red = { id: 'chicken_red', kind: 'mob', outline: 'mob', build: kit => chickenModel(kit, 1, !kit.skin.SKINS.on) };
// Наставник Элвин: «Было» — процедурный житель деревни (смотрит в −Z, в деревне его разворачивает игра), «Стало» — Элвин из Meshy
// на скелете героя (assets/models/npc_trainer.*): меч в кулаке, удар — «Атака»
MOBS.npc_trainer = { id: 'npc_trainer', kind: 'npc', outline: 'mob', build: kit => { const m = NPC_TRAINER.build(kit); if (!m.skin) m.root.rotation.y = Math.PI; return m; } };
// сборка 57: нежить подземелий — «Было» процедурная со своим оружием, «Стало» модель с Диска (оружие в кисти — часть модели)
const { MOBS: REG, WEAPONS } = await import(BASE + 'js/render3d/registry.js');
const DUNGEON = { skel_warrior: 'Скелет-воин', skel_archer: 'Скелет-лучник', skel_mage: 'Колдун', ghoul: 'Упырь', elite_guard: 'Страж Медальона', elite_warlord: 'Страж глубин', boss: 'Палач Бездны', bone_wolf: 'Костяной волк' };
for (const id of Object.keys(DUNGEON)) MOBS[id] = REG[id];
const NAMES0 = { npc_trainer: 'Наставник Элвин', dog_brown: 'Собака', chicken_white: 'Курица белая', chicken_red: 'Курица рыжая', archer: 'Лучник', warrior: 'Воин', mage: 'Маг', w_wolf: 'Волк', f_wolf: 'Ледяной волк', w_bear: 'Медведь', w_boar: 'Кабан', b_boar: 'Пустынный кабан', b_hyena: 'Гиена', b_scorpid: 'Скорпион', beast: 'Пещерный зверь' };
const NAMES = { ...DUNGEON, ...NAMES0 };

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(), kit = makeKit(scene);
await kit.fur.ready; await kit.skin.preloadSkin('archer_raven'); await kit.skin.preloadSkin('warrior_vanguard'); await kit.skin.preloadSkin('mage_archmage'); await kit.mob.preloadMob('wolf_grey'); for (const n of ['dog_brown', 'wolf_ice', 'beast', 'chicken_white', 'chicken_red', 'hyena', 'w_boar', 'b_boar', 'w_bear', 'b_scorpid']) await kit.mob.preloadMob(n); await kit.skin.preloadSkin('npc_trainer'); for (const n of ['skel_warrior_m', 'skel_archer_m', 'skel_mage_m', 'ghoul_m', 'elite_guard_m', 'elite_warlord_m', 'boss_m']) await kit.skin.preloadSkin(n);
const camera = new THREE.PerspectiveCamera(CAMERA.fov, 1, 0.3, 200);
const hemi = new THREE.HemisphereLight(), sun = new THREE.DirectionalLight();
sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 60 }); sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03;
scene.add(hemi, sun, sun.target);
const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 48), new THREE.MeshToonMaterial({ map: grassTex() }));
ground.material.map.repeat.set(10, 10); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const LIGHTS = { village: 'Деревня', torch: 'Катакомбы', dark: 'Холод' };
function setLight(k) {
  const L = LIGHT[k]; hemi.color.set(L.hemi.sky); hemi.groundColor.set(L.hemi.ground); hemi.intensity = L.hemi.i;
  sun.color.set(L.key.color); sun.intensity = L.key.i; sun.position.set(...L.key.offset).normalize().multiplyScalar(30);
  renderer.setClearColor(L.clear); scene.fog = new THREE.Fog(L.fog.color, 40, 110);
  ground.material.color.set(k === 'village' ? 0x9aa890 : k === 'torch' ? 0x8a7a66 : 0x9aa6c0);
}

// --- состояние
const QS = (() => { try { return Object.fromEntries(new URLSearchParams(location.search)); } catch { return {}; } })();   // ?mob=&clip=&light= — для снимков
const S = { mob: QS.mob || 'skel_warrior', mode: QS.mode || 'side', clip: QS.clip || 'walk', cam: 'game', spin: false, light: QS.light || 'torch' };
let actors = [];   // { a, side: -1 | 0 | 1, on }
function build() {
  for (const e of actors) e.a.dispose();   // вместе с плащом (он живёт в сцене, а не в модели)
  const list = S.mode === 'side' ? [[false, -1], [true, 1]] : [[S.mode === 'new', 0]];
  actors = list.map(([on, side]) => {
    kit.fur.FUR.on = on; kit.skin.SKINS.on = on;
    const a = new Actor(MOBS[S.mob], kit, scene); a.root.traverse(o => { if (o.isMesh && !o.userData.isOutline) o.castShadow = true; });
    if (S.mob === 'archer') { a.root.scale.setScalar(HERO.scale); a.equip('handL', BOW); }   // как в игре: герой на 10 % крупнее, лук в левой руке
    if (DUNGEON[S.mob]) for (const [slot, id] of Object.entries(a.model.defaultWeapons || {})) a.equip(slot, WEAPONS[id]);   // как в игре (у модели noEquip — пропускается)
    if (S.mob === 'mage') { a.root.scale.setScalar(HERO.scale); a.equip('handR', STAFF); }
    if (S.mob === 'warrior') { a.root.scale.setScalar(HERO.scale); a.equip('handR', SWORD); if (SHIELD) a.equip('handL', SHIELD); }
    return { a, side, on, ph: 0 };
  });
  kit.fur.FUR.on = true; kit.skin.SKINS.on = true;
  target.y = DUNGEON[S.mob] ? (S.mob === 'bone_wolf' ? 0.6 : S.mob === 'boss' || S.mob.startsWith('elite') ? 1.6 : 1.1) : ['archer', 'warrior', 'mage', 'npc_trainer'].includes(S.mob) ? 1.15 : ['dog_brown', 'chicken_white', 'chicken_red'].includes(S.mob) ? 0.45 : 0.8;   // камера смотрит в середину фигуры
  document.getElementById('tags').classList.toggle('show', S.mode === 'side');
  clipT = 0;
}

// --- камера: игровой ракурс (поворот 45°, наклон 0.64 рад) или свободная (палец/мышь — вращение, щипок/колесо — приближение)
let yaw = CAMERA.yaw, pitch = 0.42, dist = 9, gameDist = 16;
const target = new THREE.Vector3(0, 0.8, 0);
function placeCam(dt) {
  const isGame = S.cam === 'game';
  if (S.spin && !isGame) yaw += dt * 0.5;
  const y = isGame ? CAMERA.yaw : yaw, p = isGame ? CAMERA.village.pitch : pitch, d = isGame ? gameDist : dist;
  camera.position.set(Math.sin(y) * Math.cos(p), Math.sin(p), Math.cos(y) * Math.cos(p)).multiplyScalar(d).add(target);
  camera.lookAt(target);
}
const ptrs = new Map(); let pinch0 = 0, dist0 = 0;
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); dist0 = S.cam === 'game' ? gameDist : dist; } });
canvas.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const [px, py] = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); zoomTo(dist0 * pinch0 / Math.max(20, d)); return; }
  if (S.cam === 'game') setCam('free');
  yaw -= (e.clientX - px) * 0.008; pitch = Math.min(1.3, Math.max(0.02, pitch + (e.clientY - py) * 0.006));
});
const up = e => ptrs.delete(e.pointerId); canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('wheel', e => { e.preventDefault(); zoomTo((S.cam === 'game' ? gameDist : dist) * Math.exp(e.deltaY * 0.001)); }, { passive: false });
function zoomTo(d) { d = Math.min(40, Math.max(2.5, d)); if (S.cam === 'game') gameDist = d; else dist = d; }

// --- клипы: разовые повторяются по кругу (прогресс k 0…1 за dur, пауза), «ходьба» — по кругу радиусом 2.6 м
const CLIPS = [['idle', 'Стоит'], ['walk', 'Ходьба'], ['run', 'Бег'], ['attack', 'Атака'], ['cast', 'Выстрел/рёв'], ['hit', 'Удар'], ['dodge', 'Перекат'], ['death', 'Смерть']];
let clipT = 0, t = 0, last = performance.now();
const YAW0 = (() => { try { return +(new URLSearchParams(location.search).get('yaw') || 0); } catch { return 0; } })();   // ?yaw=3.14 — повернуть «Профиль» (для снимков)
const FREEZE = (() => { try { const v = new URLSearchParams(location.search).get('freeze'); return v == null ? null : +v; } catch { return null; } })();   // ?freeze=0.5 — остановить разовый клип на этой фазе (для снимков)
const env = { wind: new THREE.Vector2(0.6, 0.3) };
function drive(dt) {
  clipT += dt;
  const right = new THREE.Vector3(Math.cos(CAMERA.yaw), 0, -Math.sin(CAMERA.yaw));
  for (const e of actors) {
    const a = e.a, spec = a.model.clips[S.clip] || {}, sideOff = right.clone().multiplyScalar(e.side * 1.1 * Math.max(1.3, a.model.height));
    if (S.clip === 'walk' || S.clip === 'run') {
      const ang = clipT * (S.clip === 'run' ? 1.2 : 0.55), R = 2.4;
      // по кругу вокруг своей точки; смотрит по касательной
      a.place(sideOff.x + Math.cos(ang) * R * (S.mode === 'side' ? 0.45 : 1), sideOff.z + Math.sin(ang) * R * (S.mode === 'side' ? 0.45 : 1));
      a.faceAngle(Math.atan2(Math.cos(ang), -Math.sin(ang)));
      a.update(dt, { clip: 'walk', speed: S.clip === 'run' ? 4.3 : ['archer', 'warrior', 'mage'].includes(S.mob) ? 3.6 : 1.6 }, env);   // бег — скорость волка в игре (4,3 м/с)
    } else {
      a.place(sideOff.x, sideOff.z); a.faceAngle(CAMERA.yaw);
      if (spec.loop || S.clip === 'idle') a.update(dt, { clip: S.clip }, env);
      else {
        const dur = spec.dur || 1, hold = S.clip === 'death' ? 1.2 : 0.5, cyc = (clipT % (dur + hold)), k = FREEZE ?? Math.min(1, cyc / dur);
        if (cyc < dt && clipT > dt) a.update(0, { clip: 'idle' }, env);   // перезапуск клипа
        a.update(dt, { clip: S.clip, k }, env);
        a.flash(S.clip === 'hit' ? Math.max(0, 1 - k * 4) : 0, 0xffffff);
      }
    }
  }
}

// --- интерфейс
function chips(el, items, get, set) {
  const box = document.getElementById(el); box.innerHTML = '';
  for (const [k, n] of items) { const b = document.createElement('button'); b.textContent = n; b.onclick = () => { set(k); render(); }; b.dataset.k = k; box.appendChild(b); }
  const render = () => box.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === get()));
  render(); return render;
}
const setCam = c => { S.cam = c; camR(); };
chips('mobs', Object.entries(NAMES), () => S.mob, k => { S.mob = k; build(); });
chips('mode', [['old', 'Было'], ['new', 'Стало'], ['side', 'Рядом']], () => S.mode, k => { S.mode = k; build(); });
chips('clips', CLIPS, () => S.clip, k => { S.clip = k; clipT = 0; });
const camR = chips('cam', [['game', 'Игровая'], ['free', 'Свободная'], ['close', 'Крупно'], ['side', 'Профиль']], () => S.cam, k => { if (k === 'side') { const hh = actors[0] ? actors[0].a.model.height : 1.5; S.cam = 'free'; dist = (S.mode === 'side' ? 6 : 3.4) * Math.max(1, hh / 1.4) + 1; pitch = 0.12; yaw = CAMERA.yaw + Math.PI / 2 + YAW0; } else if (k === 'close') { const hh = actors[0] ? actors[0].a.model.height : 1.5; S.cam = 'free'; dist = (S.mode === 'side' ? 6 : 3.2) * Math.max(1, hh / 1.4) + 1; pitch = 0.3; yaw = CAMERA.yaw; } else S.cam = k; camR(); });
chips('light', Object.entries(LIGHTS), () => S.light, k => { S.light = k; setLight(k); });
const spinB = document.getElementById('spin'); spinB.onclick = () => { S.spin = !S.spin; if (S.spin && S.cam === 'game') setCam('free'); spinB.classList.toggle('on', S.spin); };

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); gameDist = w / h < 1 ? 16 * Math.min(1.5, 0.85 / (w / h)) : 16; }
addEventListener('resize', resize); resize(); setLight(S.light); build();
document.getElementById('load').remove();
const info = document.getElementById('info'); let fpsN = 0, fpsT = 0;
renderer.info.autoReset = false;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt; U.uTime.value = t;
  drive(dt); placeCam(dt); U.uCam.value.copy(camera.position); U.uFocus.value.set(0, -50, 0);
  renderer.info.reset(); renderer.render(scene, camera);
  fpsN++; fpsT += dt; if (fpsT > 0.5) { info.textContent = `${Math.round(fpsN / fpsT)} к/с\n${renderer.info.render.triangles} тр. · ${renderer.info.render.calls} выз.`; fpsN = 0; fpsT = 0; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
